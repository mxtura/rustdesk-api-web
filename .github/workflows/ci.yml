name: CI

on:
  push:
    branches: [modernize, theme, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Lint (информационно)
        run: npm run lint:check
        continue-on-error: true
      - name: Typecheck (информационно)
        run: npm run typecheck
        continue-on-error: true
